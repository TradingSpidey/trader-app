<aside class="rail">
  <a class="brand" href="/">
    <span class="logo" aria-hidden="true">即</span>
    <span class="brand-text">
      <strong>即日鮮研究室</strong>
      <small>模擬研究</small>
    </span>
  </a>
  <nav class="sidebar" aria-label="功能">
    <p class="nav-label">研究</p>
    {% if request.path == '/' %}
    <button type="button" data-tab="trade" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 L4 6M4 19h16"/><path d="M7 15l4-6 3 3 6-8"/></svg>
      <span>分析一隻股</span>
    </button>
    <button type="button" data-tab="scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      <span>掃描市場</span>
    </button>
    <button type="button" data-tab="analyst">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19 L6 10M11 19 L11 6M16 19 L16 12M21 19 L21 8"/></svg>
      <span>業績</span>
    </button>
    <button type="button" data-tab="pelosi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>
      <span>議員交易</span>
    </button>
    {% else %}
    <a href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 L4 6M4 19h16"/><path d="M7 15l4-6 3 3 6-8"/></svg>
      <span>分析一隻股</span>
    </a>
    <a href="/?tab=scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      <span>掃描市場</span>
    </a>
    <a href="/?tab=analyst">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19 L6 10M11 19 L11 6M16 19 L16 12M21 19 L21 8"/></svg>
      <span>業績</span>
    </a>
    <a href="/?tab=pelosi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg>
      <span>議員交易</span>
    </a>
    {% endif %}
    <p class="nav-label">模擬盤</p>
    <a href="/desk" class="{{ 'active' if request.path == '/desk' else '' }}" {% if request.path == '/desk' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v10H4zM8 20h8M12 16v4"/></svg>
      <span>SPIDEY 交易台</span>
    </a>
    <a href="/paper" class="{{ 'active' if request.path == '/paper' else '' }}" {% if request.path == '/paper' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19 L6 7M6 19h13"/><path d="M9 15l3-4 2 2 4-6"/></svg>
      <span>$50 模擬盤成績</span>
    </a>
    <a href="/paper/demo" class="{{ 'active' if request.path == '/paper/demo' else '' }}" {% if request.path == '/paper/demo' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h13M8 16 L8 9M13 16 L13 6M18 16 L18 12"/></svg>
      <span>Demo 排行</span>
    </a>
    <a href="/paper/demo/stocks" class="{{ 'active' if request.path == '/paper/demo/stocks' else '' }}" {% if request.path == '/paper/demo/stocks' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h13M8 16 L8 11M13 16 L13 7M18 16 L18 9"/></svg>
      <span>美股 Demo 排行</span>
    </a>
    <a href="/paper/methods" class="{{ 'active' if request.path == '/paper/methods' else '' }}" {% if request.path == '/paper/methods' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16V9M12 16V7M17 16V10"/></svg>
      <span>五方法紙盤</span>
    </a>
    <a href="/paper/gold" class="{{ 'active' if request.path == '/paper/gold' else '' }}" {% if request.path == '/paper/gold' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 6.4H21l-5.4 4 2 6.6L12 16.8 6.4 20l2-6.6L3 9.4h6.8z"/></svg>
      <span>黃金紙盤</span>
    </a>
    <a href="/paper/btc" class="{{ 'active' if request.path == '/paper/btc' else '' }}" {% if request.path == '/paper/btc' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M10 8.2h4.1a2 2 0 0 1 0 4H10M10 12.2h4.5a2 2 0 0 1 0 4H10M12 6.2V8M12 16.2V18"/></svg>
      <span>比特幣紙盤</span>
    </a>
    <a href="/paper/v2" class="nav-secondary {{ 'active' if request.path == '/paper/v2' else '' }}" {% if request.path == '/paper/v2' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 12l7-4M12 12v9M12 12L5 8"/></svg>
      <span>QUANT V2（實驗）</span>
    </a>
  </nav>
  <p class="rail-foot">模擬盤，唔係真錢，唔係投資建議</p>
</aside>
