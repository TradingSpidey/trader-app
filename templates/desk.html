<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>SPIDEY 交易台（模擬盤）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%233ee0ff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/desk.css">
</head>
<body>
<div class="particles" id="particles" aria-hidden="true"></div>
<div class="desk">
<header class="top">
  <div class="brand">
    <a class="back" href="/">研究室</a>
    <div>
      <p class="kicker">SOLANA · 公開行情</p>
      <h1>SPIDEY 交易台</h1>
    </div>
  </div>
  <div class="stats" id="stats" aria-live="polite">
    <div class="stat"><span>今日模擬盈虧</span><b class="num">—</b></div>
    <div class="stat"><span>勝率</span><b class="num">—</b></div>
    <div class="stat"><span>模擬權益</span><b class="num">—</b></div>
  </div>
  <div class="actions">
    <button type="button" id="kill" class="ghost">風控停止</button>
    <button type="button" id="reset" class="ghost">重置模擬倉</button>
  </div>
</header>
<p class="banner" role="note"><b>模擬盤，唔係真錢，唔係投資建議。</b>唔會連接錢包，亦唔會落真單。免費伺服器瞓着或者重啟之後，呢個模擬倉會清走。</p>
<div class="tape-wrap" aria-label="行情走馬燈">
  <span class="tag live">即時行情</span>
  <div class="tape" id="tape"><span class="muted">讀緊公開行情…</span></div>
</div>
<div class="layout">
  <div class="floor">
    <article class="panel chief" id="chief" aria-label="主管"></article>
    <div class="bots" id="bots"></div>
    <div class="split">
      <section class="panel" id="radar" aria-label="新池雷達"></section>
      <section class="panel" id="rules" aria-label="規則"></section>
    </div>
  </div>
  <aside class="side">
    <section class="panel" id="roster" aria-label="值班表"></section>
    <section class="panel feed" id="feed" aria-label="動態"></section>
    <section class="panel" id="book" aria-label="模擬持倉"></section>
  </aside>
</div>
<p class="foot" id="foot"></p>
</div>
<script src="/static/desk.js"></script>
</body>
</html>
