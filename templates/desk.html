<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>SPIDEY 交易台（模擬盤）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307080c'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%232fce85' font-family='sans-serif'%3E即%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/desk.css">
</head>
<body>
<a class="skip" href="#main">跳到內容</a>
<div class="particles" id="particles" aria-hidden="true"></div>
<div class="app">
{% include "_rail.html" %}
<header class="topbar">
  <div class="top-brand">
    <strong>SPIDEY 交易台</strong>
    <span class="kicker" id="kicker">SOLANA · 公開行情</span>
  </div>
  <p class="session-line" id="session-line">讀緊市場時間…</p>
  <div class="switch" role="tablist" aria-label="市場">
    <button type="button" id="m-crypto" class="on" role="tab" aria-selected="true">加密貨幣</button>
    <button type="button" id="m-stocks" role="tab" aria-selected="false">美股</button>
  </div>
</header>
<div class="workspace">
<p class="banner" role="note"><b>模擬盤，唔係真錢，唔係投資建議。</b>唔會連接錢包，亦唔會落真單。網頁上嘅模擬倉喺伺服器瞓着或者重啟之後會清走。</p>
<main id="main">
<p class="demo-note" id="demo-note">網站示範盤（10 SOL，Render 休眠會重置）</p>
<div class="toolbar">
  <div class="stats" id="stats" aria-live="polite">
    <div class="stat"><span>今日模擬盈虧</span><b class="num">—</b></div>
    <div class="stat"><span>勝率（已平倉）</span><b class="num">—</b></div>
    <div class="stat"><span>模擬權益</span><b class="num">—</b></div>
    <div class="stat"><span>SOL 報價</span><b class="num">—</b></div>
  </div>
  <div class="actions">
    <div class="health" id="health" aria-label="數據源狀態"></div>
    <button type="button" id="kill" class="ghost">風控停止</button>
    <button type="button" id="reset" class="ghost">重置模擬倉</button>
  </div>
</div>
<div class="office-scroll" id="office-scroll">
  <div class="office stations" id="office" aria-label="交易室"></div>
</div>
<div id="detail" class="detail-pop" hidden></div>
<div class="tape-wrap" aria-label="行情走馬燈">
  <span class="tag live">即時行情</span>
  <div class="tape" id="tape"><span class="muted">讀緊公開行情…</span></div>
  <span class="tag" id="tape-age"></span>
</div>
<div class="layout">
  <div class="floor">
    <article class="panel chief" id="chief" aria-label="主管"><h2>主管</h2><p class="muted">等緊第一輪行情。</p></article>
    <div class="bots" id="bots"></div>
    <div class="split">
      <section class="panel" id="radar" aria-label="新池雷達"><h2>雷達</h2><p class="muted">讀緊公開行情…</p></section>
      <section class="panel" id="rules" aria-label="規則"><h2>規則</h2><p class="muted">規則會喺第一輪之後列出。</p></section>
    </div>
  </div>
  <aside class="side">
    <section class="panel" id="roster" aria-label="值班表"><h2>值班表</h2><p class="muted">等緊角色。</p></section>
    <section class="panel feed" id="feed" aria-label="動態"><h2>動態</h2><p class="muted">未有動態</p></section>
    <section class="panel" id="book" aria-label="模擬持倉"><h2>模擬持倉</h2><p class="muted">未有模擬倉。規則未過就唔會造數。</p></section>
  </aside>
</div>
<p class="foot" id="foot"></p>
</main>
</div>
</div>
<script src="/static/desk.js"></script>
</body>
</html>
